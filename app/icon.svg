<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- SHG trip 마크: 굽은 길 + 도착점.
       이전 마크(경선 그려진 지구)는 브라우저 기본 아이콘처럼 생겨 브랜드가 없었다.
       이 앱이 실제로 그리는 것은 "경유지를 잇는 경로"라서 그걸 마크로 삼았다.
       곡선이 S를 그려 이름(SHG)과도 겹친다. 도착점만 샤르트뢰즈로 브랜드색을 넣는다.
       16·28·64px로 래스터해 고른 형태다 — 링/간격 변형은 16px에서 뭉갰다. -->
  <rect width="32" height="32" rx="8" fill="#1c1c1e"/>
  <path d="M8 23C13 23 12 11 23 10" fill="none" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="23" cy="10" r="3.6" fill="#c8d158"/>
</svg>
