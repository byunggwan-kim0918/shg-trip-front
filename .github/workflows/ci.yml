name: CI

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 타입 에러 조기 감지
      - name: Type check
        run: npx tsc --noEmit

      # 코드 스타일/품질
      - name: Lint
        run: npm run lint

      # 빌드 실패 감지
      - name: Build
        run: npm run build
